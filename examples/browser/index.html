<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwirlDB Browser Example</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #f9f9f9;
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
        }
        input, button {
            padding: 8px 12px;
            margin: 5px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background: #45a049;
        }
        #output {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌀 SwirlDB Browser Example</h1>
        <p>A modular-first CRDT-based embedded database running in WASM</p>

        <div class="section">
            <h3>Set Value</h3>
            <input type="text" id="setPath" placeholder="path (e.g., user.name)" value="user.name">
            <input type="text" id="setValue" placeholder="value" value="Alice">
            <button onclick="setValue()">Set</button>
        </div>

        <div class="section">
            <h3>Get Value</h3>
            <input type="text" id="getPath" placeholder="path" value="user.name">
            <button onclick="getValue()">Get</button>
        </div>

        <div class="section">
            <h3>Observer</h3>
            <input type="text" id="observePath" placeholder="path to observe" value="user.name">
            <button onclick="addObserver()">Add Observer</button>
            <p><small>Observers will log changes to the output below</small></p>
        </div>

        <div class="section">
            <h3>State Management</h3>
            <button onclick="saveToLocalStorage()">Save to LocalStorage</button>
            <button onclick="loadFromLocalStorage()">Load from LocalStorage</button>
            <button onclick="clearLocalStorage()">Clear LocalStorage</button>
        </div>

        <div class="section">
            <h3>Output</h3>
            <div id="output"></div>
        </div>
    </div>

    <script type="module">
        import init, { SwirlDB } from '/packages/browser-wasm/swirldb_core.js';

        let db;

        async function initDB() {
            await init();
            window.db = new SwirlDB();
            log('✅ SwirlDB initialized');
        }

        function log(message) {
            const output = document.getElementById('output');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.prepend(entry);
        }

        window.setValue = function() {
            const path = document.getElementById('setPath').value;
            const value = document.getElementById('setValue').value;

            try {
                // Try to parse as number if possible
                const numValue = Number(value);
                const finalValue = isNaN(numValue) ? value : numValue;

                window.db.setPath(path, finalValue);
                log(`✏️  Set ${path} = ${JSON.stringify(finalValue)}`);
            } catch (e) {
                log(`❌ Error: ${e.message}`);
            }
        };

        window.getValue = function() {
            const path = document.getElementById('getPath').value;

            try {
                const value = window.db.getPath(path);
                log(`📖 Get ${path} = ${JSON.stringify(value)}`);
            } catch (e) {
                log(`❌ Error: ${e.message}`);
            }
        };

        window.addObserver = function() {
            const path = document.getElementById('observePath').value;

            try {
                window.db.observe(path, (newValue) => {
                    log(`👀 Observer [${path}] fired: ${JSON.stringify(newValue)}`);
                });
                log(`✅ Added observer for: ${path}`);
            } catch (e) {
                log(`❌ Error: ${e.message}`);
            }
        };

        window.saveToLocalStorage = function() {
            try {
                const state = window.db.saveState();
                // Convert Uint8Array to base64 for localStorage
                const base64 = btoa(String.fromCharCode(...state));
                localStorage.setItem('swirldb-state', base64);
                log(`💾 Saved state to localStorage (${state.length} bytes)`);
            } catch (e) {
                log(`❌ Error: ${e.message}`);
            }
        };

        window.loadFromLocalStorage = function() {
            try {
                const base64 = localStorage.getItem('swirldb-state');
                if (!base64) {
                    log('⚠️  No saved state found in localStorage');
                    return;
                }

                // Convert base64 back to Uint8Array
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }

                window.db.loadState(bytes);
                log(`📥 Loaded state from localStorage (${bytes.length} bytes)`);
            } catch (e) {
                log(`❌ Error: ${e.message}`);
            }
        };

        window.clearLocalStorage = function() {
            localStorage.removeItem('swirldb-state');
            log('🗑️  Cleared localStorage');
        };

        // Initialize on load
        initDB();
    </script>
</body>
</html>
