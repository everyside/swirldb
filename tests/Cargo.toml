[package]
name = "swirldb-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[[test]]
name = "integration"
path = "integration/mod.rs"

[dependencies]
# Core dependencies
swirldb-core = { path = "../native/swirldb-core" }
swirldb-server = { path = "../native/swirldb-server" }
swirldb-client = { path = "../native/swirldb-client" }

# Automerge for CRDT types
automerge = "0.6.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures = "0.3"

# HTTP/WebSocket
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.6", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
