<!DOCTYPE html>
<html>
<head>
    <title>SwirlDB Browser Test</title>
    <script type="module">
        import init, { SwirlDB, Connection } from '../../native/swirldb-browser/pkg/swirldb_browser.js';

        // Single-document path: the manual protocol, as the original tests drove it.
        let db = null;
        let ws = null;

        // Multi-document path: one Connection, several handles keyed by document id.
        let connection = null;
        const handles = new Map();
        // Per document, broadcasts seen since last asked for, and a waiter for the next.
        const changes = new Map();
        const presence = new Map();
        // Per document, the text changes heard from the server, in order.
        const textChanges = new Map();
        // Per document and path, every observer call: { value, path, changedPaths, local }.
        const observations = new Map();

        window.testAPI = {
            async connect(wsUrl, subscriptions) {
                console.log('Connecting to:', wsUrl);
                await init();
                db = new SwirlDB();

                return new Promise((resolve, reject) => {
                    ws = new WebSocket(wsUrl);
                    ws.binaryType = 'arraybuffer';

                    ws.onopen = () => {
                        console.log('WebSocket opened');
                        const heads = db.getHeads();
                        const clientId = `browser-${Date.now()}`;
                        const connectMsg = db.encodeConnectMessage(clientId, subscriptions, heads);
                        ws.send(connectMsg);
                    };

                    ws.onmessage = (event) => {
                        try {
                            const data = new Uint8Array(event.data);
                            const msg = db.decodeMessage(data);
                            console.log('Received:', msg.type);

                            if (msg.type === 'SubscribeAck') {
                                console.log('Subscribe ACK');
                            } else if (msg.type === 'Sync') {
                                if (msg.changes && msg.changes.length > 0) {
                                    db.applyChanges(msg.changes);
                                }
                                console.log('Connected');
                                resolve();
                            } else if (msg.type === 'Broadcast') {
                                if (msg.changes && msg.changes.length > 0) {
                                    db.applyChanges(msg.changes);
                                }
                                window.lastBroadcast = msg;
                            } else if (msg.type === 'PushAck') {
                                console.log('Push ACK');
                            }
                        } catch (err) {
                            console.error('Error:', err);
                        }
                    };

                    ws.onerror = (err) => {
                        console.error('WebSocket error:', err);
                        reject(err);
                    };

                    setTimeout(() => reject(new Error('Connection timeout')), 5000);
                });
            },

            setPath(path, value) {
                db.setPath(path, value);
                const changes = db.getChanges();
                const heads = db.getHeads();
                const pushMsg = db.encodePushMessage(heads, changes);
                ws.send(pushMsg);
            },

            getPath(path) {
                return db.getPath(path);
            },

            waitForBroadcast(timeout = 2000) {
                return new Promise((resolve, reject) => {
                    const start = Date.now();
                    const check = () => {
                        if (window.lastBroadcast) {
                            const msg = window.lastBroadcast;
                            window.lastBroadcast = null;
                            resolve(msg);
                        } else if (Date.now() - start > timeout) {
                            reject(new Error('Timeout waiting for broadcast'));
                        } else {
                            setTimeout(check, 10);
                        }
                    };
                    check();
                });
            },

            // ---- several documents over one connection ----

            /// Open every named document on one connection; resolves when all
            /// have their history. A refused document rejects with its reason.
            async openDocuments(wsUrl, documents) {
                await init();
                connection = new Connection(wsUrl, `browser-${Date.now()}`);
                for (const document of documents) {
                    const handle = await connection.openDocument(document, ['**']);
                    handles.set(document, handle);
                    changes.set(document, 0);
                    presence.set(document, []);
                    textChanges.set(document, []);
                    // An observer on "**" fires for every write on this document;
                    // the ones this browser made are passed by, so the count is
                    // what arrived from the server.
                    handle.observe('**', (value, change) => {
                        if (change.local) return;
                        changes.set(document, changes.get(document) + 1);
                    });
                    handle.onEphemeral('presence.*', (path, data) => {
                        presence.get(document).push({ path, data: Array.from(data) });
                    });
                }
                return Array.from(handles.keys());
            },

            setDocumentPath(document, path, value) {
                const handle = handles.get(document);
                handle.setPath(path, value);
                handle.syncChanges();
            },

            // ---- text ----

            /// Put a text at a path and start recording what the server does to it.
            setDocumentText(document, path, text) {
                const handle = handles.get(document);
                handle.setText(path, text);
                handle.observeText(path, (change) => {
                    if (!change.local) {
                        textChanges.get(document).push(change);
                    }
                });
                handle.syncChanges();
            },

            spliceDocumentText(document, path, position, deleteCount, insert) {
                const handle = handles.get(document);
                handle.spliceText(path, position, deleteCount, insert);
                handle.syncChanges();
            },

            takeDocumentTextChanges(document) {
                const seen = textChanges.get(document);
                textChanges.set(document, []);
                return seen;
            },

            waitForDocumentTextChange(document, timeout = 2000) {
                return new Promise((resolve, reject) => {
                    const start = Date.now();
                    const check = () => {
                        if (textChanges.get(document).length > 0) {
                            resolve();
                        } else if (Date.now() - start > timeout) {
                            reject(new Error(`Timeout waiting for a text change on ${document}`));
                        } else {
                            setTimeout(check, 10);
                        }
                    };
                    check();
                });
            },

            getDocumentPath(document, path) {
                return handles.get(document).getPath(path);
            },

            getDocumentValue(document, path) {
                return handles.get(document).getValue(path);
            },

            deleteDocumentPath(document, path) {
                const handle = handles.get(document);
                handle.deletePath(path);
                handle.syncChanges();
            },

            // ---- observers ----

            /// Observe a path on a document and record every call, local or not.
            observeDocumentPath(document, path) {
                const key = `${document}\n${path}`;
                observations.set(key, []);
                handles.get(document).observe(path, (value, change) => {
                    observations.get(key).push({
                        value: value === undefined ? null : value,
                        path: change.path,
                        changedPaths: change.changedPaths,
                        local: change.local,
                    });
                });
            },

            takeDocumentObservations(document, path) {
                const key = `${document}\n${path}`;
                const seen = observations.get(key) ?? [];
                observations.set(key, []);
                return seen;
            },

            waitForDocumentObservation(document, path, timeout = 2000) {
                const key = `${document}\n${path}`;
                return new Promise((resolve, reject) => {
                    const start = Date.now();
                    const check = () => {
                        if ((observations.get(key) ?? []).length > 0) {
                            resolve();
                        } else if (Date.now() - start > timeout) {
                            reject(new Error(`Timeout waiting for an observation of ${path} on ${document}`));
                        } else {
                            setTimeout(check, 10);
                        }
                    };
                    check();
                });
            },

            documentAccess(document) {
                return handles.get(document).access;
            },

            sendDocumentPresence(document, path, bytes) {
                handles.get(document).sendEphemeral(path, new Uint8Array(bytes));
            },

            takeDocumentPresence(document) {
                const seen = presence.get(document);
                presence.set(document, []);
                return seen;
            },

            waitForDocumentChange(document, timeout = 2000) {
                return new Promise((resolve, reject) => {
                    const start = Date.now();
                    const check = () => {
                        if (changes.get(document) > 0) {
                            changes.set(document, changes.get(document) - 1);
                            resolve();
                        } else if (Date.now() - start > timeout) {
                            reject(new Error(`Timeout waiting for a change on ${document}`));
                        } else {
                            setTimeout(check, 10);
                        }
                    };
                    check();
                });
            },

            close() {
                if (ws) {
                    ws.close();
                }
                if (connection) {
                    connection.close();
                }
            }
        };

        console.log('Browser test API ready');
    </script>
</head>
<body>
    <h1>SwirlDB Browser Test</h1>
    <div id="status">Initializing...</div>
</body>
</html>
