[package]
name = "swirldb-browser"
version = "0.2.0"
edition = "2021"
authors = ["Everyside Innovations, LLC"]
description = "Browser WASM bindings for SwirlDB"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core SwirlDB engine
swirldb-core = { path = "../swirldb-core" }

# CRDT engine (re-exported from core, but needed for WASM bindings)
automerge = "0.6.1"

# Async support
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
base64 = "0.21"

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Storage",
    "Window",
    "console",
    "Event",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbRequest",
    "IdbOpenDbRequest",
    "IdbVersionChangeEvent",
    "DomStringList",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
] }
console_error_panic_hook = "0.1"

# Error handling
anyhow = "1.0"

# automerge instruments itself with tracing; nothing in the browser subscribes, so compile the events out
tracing = { version = "0.1", default-features = false, features = ["release_max_level_off"] }

# uuid is pulled in by automerge, but needs WASM-specific features
uuid = { version = "1.18", features = ["v4", "js", "serde"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

# This crate is outside the workspace, so the workspace profile does not reach it and
# wasm-pack runs a plain `cargo build --release`: without this block it shipped at
# opt-level 3 with no LTO. The module loads only when a collaborative document opens,
# so it is optimized for download size, not throughput.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
