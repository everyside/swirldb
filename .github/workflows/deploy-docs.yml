name: Deploy Docs to GitHub Pages

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install build dependencies
        run: |
          cd native/swirldb-browser
          npm install

      - name: Build WASM package and TypeScript wrapper
        run: |
          cd native/swirldb-browser
          # Build WASM
          wasm-pack build --target web --out-dir ../../docs/public/wasm
          # Copy to admin as well
          cp -r ../../docs/public/wasm/* ../../admin/public/wasm/ 2>/dev/null || mkdir -p ../../admin/public/wasm/ && cp -r ../../docs/public/wasm/* ../../admin/public/wasm/
          # Build TypeScript wrapper
          npm run build:wrapper
          # Copy wrapper to docs and admin
          cp pkg/swirldb.js ../../docs/public/
          cp pkg/swirldb.js ../../admin/public/

      - name: Install docs dependencies
        run: |
          cd docs
          pnpm install --frozen-lockfile

      - name: Build docs site
        run: |
          cd docs
          pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
