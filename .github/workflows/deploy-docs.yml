name: Deploy Docs to GitHub Pages

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download browser artifacts
        uses: actions/download-artifact@v4
        with:
          name: browser-wasm
          path: browser-wasm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Copy WASM artifacts to docs and admin
        run: |
          # Copy to docs
          mkdir -p docs/public/wasm
          cp browser-wasm/swirldb_browser* docs/public/wasm/
          cp browser-wasm/swirldb.js docs/public/
          # Copy to admin
          mkdir -p admin/public/wasm
          cp browser-wasm/swirldb_browser* admin/public/wasm/
          cp browser-wasm/swirldb.js admin/public/

      - name: Install docs dependencies
        run: |
          cd docs
          pnpm install --frozen-lockfile

      - name: Build docs site
        run: |
          cd docs
          pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-server:
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download server binary artifact
        uses: actions/download-artifact@v4
        with:
          name: swirldb-server
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Make binary executable
        run: chmod +x swirldb-server

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H demo.swirldb.org >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          # Upload to temp location first (can't overwrite running binary)
          scp -i ~/.ssh/deploy_key swirldb-server ubuntu@demo.swirldb.org:/home/ubuntu/swirldb-server.new
          # Backup old (if exists), replace with new, and restart
          ssh -i ~/.ssh/deploy_key ubuntu@demo.swirldb.org "test -f /home/ubuntu/swirldb-server && mv /home/ubuntu/swirldb-server /home/ubuntu/swirldb-server.backup || true && mv /home/ubuntu/swirldb-server.new /home/ubuntu/swirldb-server && sudo systemctl restart swirldb"

      - name: Verify deployment
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key ubuntu@demo.swirldb.org "sudo systemctl status swirldb --no-pager"
