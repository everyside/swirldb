[workspace]
resolver = "2"
members = [
    "native/swirldb-core",
    "native/swirldb-server",
    "native/swirldb-client",
    "tests",
]
# swirldb-browser is WASM-only; build with: cargo build -p swirldb-browser --target wasm32-unknown-unknown
exclude = ["native/swirldb-browser"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Everyside Innovations, LLC"]
license = "Apache-2.0"

[profile.release]
# Release profile
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Note: swirldb-browser uses opt-level = "z" when built via wasm-pack
