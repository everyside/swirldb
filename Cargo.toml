[workspace]
resolver = "2"
members = [
    "native/swirldb-core",
    "native/swirldb-server",
    "native/swirldb-browser",
    "tests",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Everyside Innovations, LLC"]
license = "Apache-2.0"

[profile.release]
# Release profile
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release.package.swirldb-browser]
# Browser-specific: optimize for size (WASM)
opt-level = "z"
